name: Expand agentic knowledge bootstrap

on:
  push:
    branches:
      - agent/agentic-glm-skills-reconciler
    paths:
      - ".github/workflows/agentic-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: hugin-agentic-bootstrap
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat agentic-bootstrap.part* > /tmp/hugin-agentic.b64
          base64 --decode /tmp/hugin-agentic.b64 > /tmp/hugin-agentic.tar.gz
          echo "0af8116416c40f8196ab874fd9828cc00cbf95fd1d98597efff68a5e6eff7313  /tmp/hugin-agentic.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/hugin-agentic.tar.gz | while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*) echo "unsafe archive path: $entry" >&2; exit 1 ;;
            esac
          done
      - name: Expand source tree and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/hugin-agentic.tar.gz -C .
          rm -f agentic-bootstrap.part*
          rm -f .github/workflows/agentic-bootstrap.yml
          git diff --check
      - name: Commit unified agentic implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hugin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add agentic GLM knowledge reconciliation"
          git push origin HEAD:${GITHUB_REF_NAME}
