name: Ingest HUGIN knowledge (v3)

on:
  push:
    branches: [main]
    paths:
      - "data/incoming/**/*.jsonl"
      - "data/incoming/**/*.rs"
      - "data/incoming/**/*.py"
      - "data/incoming/**/*.go"
      - "data/incoming/**/*.c"
      - "data/incoming/**/*.cc"
      - "data/incoming/**/*.cpp"
      - "data/incoming/**/*.h"
      - "data/incoming/**/*.hpp"
      - "data/incoming/**/*.ts"
      - "data/incoming/**/*.tsx"
      - "data/incoming/**/*.js"
      - "data/incoming/**/*.jsx"
      - "data/incoming/**/*.java"
      - "data/incoming/**/*.kt"
      - "data/incoming/**/*.swift"
      - "data/incoming/**/*.rb"
      - "data/incoming/**/*.php"
      - "data/incoming/**/*.cs"
      - "data/incoming/**/*.md"
      - "data/incoming/**/*.txt"
      - "data/incoming/**/*.rst"
      - "data/incoming/**/*.adoc"
      - "data/incoming/**/*.mp4"
      - "data/incoming/**/*.mov"
      - "data/incoming/**/*.mkv"
      - "data/incoming/**/*.webm"
      - "data/incoming/**/*.m4v"
      - "scripts/ingest-video.mjs"
      - "scripts/wrap-inputs.mjs"
      - "scripts/wrap-bundle-techniques.mjs"
      - "scripts/detect-format.v2.mjs"
      - "scripts/apply-mapping.v2.mjs"
      - "scripts/enrich-records.mjs"
      - "scripts/compile-canonical.mjs"
      - "scripts/lib/**"
      - "scripts/ingest-model-policy.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Specific JSONL under data/incoming"
        type: string
        default: ""
      all_inputs:
        description: "Process every incoming JSONL (explicit opt-in)"
        type: boolean
        default: false
      force_redetect:
        description: "Regenerate structural mappings"
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: hugin-universal-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.actor != 'hugin-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v5
        with:
          path: |
            .hf-cache
            .cache/nvidia-models
          key: hugin-ingest-v3-${{ hashFiles('package-lock.json', 'scripts/ingest-model-policy.json') }}
          restore-keys: |
            hugin-ingest-v3-

      - name: Install dependencies (retry transient ONNX downloads)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            echo "npm ci failed; retrying transient dependency download ($attempt/3)"
            sleep $((attempt * 10))
          done

      - name: Test ingestion contracts
        run: node tests/ingest-v2-pipeline.test.mjs

      - name: Pipeline E2E smoke test (deterministic, no LLM)
        run: node tests/pipeline-e2e.test.mjs

      - name: Ingest video notes (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: node scripts/ingest-video.mjs

      - name: Wrap missing bundled technique cards
        shell: bash
        run: node scripts/wrap-bundle-techniques.mjs

      - name: Wrap raw inputs
        shell: bash
        run: node scripts/wrap-inputs.mjs

      - name: Discover inputs
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/hugin-inputs.txt
          TARGET='${{ inputs.target }}'
          if [[ -n "$TARGET" ]]; then
            case "$TARGET" in
              data/incoming/*.jsonl|data/incoming/**/*.jsonl) ;;
              *) echo "target must be a JSONL path under data/incoming" >&2; exit 2 ;;
            esac
            [[ -f "$TARGET" ]] && printf '%s\n' "$TARGET" >> /tmp/hugin-inputs.txt
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.all_inputs }}" != "true" ]]; then
              echo "Manual runs require target, or explicit all_inputs=true" >&2
              exit 2
            fi
            find data/incoming -type f -name '*.jsonl' ! -path '*/quarantine/*' -print | sort > /tmp/hugin-inputs.txt
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin main --depth=2 2>/dev/null || true
            git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^data/incoming/.*\.jsonl$' | sort > /tmp/hugin-inputs.txt || true
            # Include JSONLs produced by wrap-inputs / ingest-video in this run
            # (untracked working-tree files under data/incoming/).
            git status --porcelain data/incoming 2>/dev/null \
              | awk '/^\?\? data\/incoming\/.*\.jsonl$/ {print $2}' \
              | grep -v '/\.wrapped/' \
              >> /tmp/hugin-inputs.txt || true
            sort -u /tmp/hugin-inputs.txt -o /tmp/hugin-inputs.txt
          fi
          echo "count=$(wc -l < /tmp/hugin-inputs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Universal ingestion
        if: steps.discover.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGIN_MODEL_CACHE: .hf-cache
          HUGIN_NVIDIA_CACHE: .cache/nvidia-models
          HUGIN_SIMPLE_MODEL: onnx-community/Qwen3.5-4B-Instruct-ONNX
          HUGIN_SIMPLE_DTYPE: q4
        shell: bash
        run: |
          set -euo pipefail
          FORCE=""
          if [[ '${{ inputs.force_redetect }}' == 'true' ]]; then FORCE="--force"; fi

          while IFS= read -r input; do
            [[ -n "$input" ]] || continue
            relative="${input#data/incoming/}"
            name="$(echo "$relative" | tr '/' '_' | sed 's/\.jsonl$//')"
            echo "::group::Ingest $input"
            node scripts/detect-format.v2.mjs "$input" $FORCE
            node scripts/apply-mapping.v2.mjs "$input"
            node scripts/enrich-records.mjs "data/normalized/${name}.jsonl" $FORCE
            node scripts/compile-canonical.mjs "data/enriched/${name}.jsonl"
            echo "::endgroup::"
          done < /tmp/hugin-inputs.txt

          node scripts/build-data.mjs
          node scripts/validate-data.mjs

      - name: Purge safely-ingested sources
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/source/ingest-manifest.json ]]; then
            echo "no ingest-manifest; skipping purge"
            exit 0
          fi

          # Requires jq (available on ubuntu-latest by default)
          purged=0
          jq -r '.sources // {} | to_entries[] | select((.value.node_ids // []) | length > 0) | .key' \
            data/source/ingest-manifest.json | while read -r src; do
            [[ -z "$src" ]] && continue
            [[ ! "$src" =~ ^data/incoming/ ]] && continue
            relative="${src#data/incoming/}"
            flat=$(echo "$relative" | tr '/' '_' | sed 's/\.jsonl$//')

            # Delete the source JSONL + its mapping sidecar
            [[ -f "$src" ]] && rm -f "$src" && purged=$((purged+1))
            [[ -f "${src%.jsonl}.mapping.json" ]] && rm -f "${src%.jsonl}.mapping.json"

            # Delete normalized + enriched derivatives
            rm -f "data/normalized/${flat}.jsonl" "data/normalized/${flat}.report.json" || true
            rm -f "data/enriched/${flat}.jsonl" "data/enriched/${flat}.report.json" || true
          done

          # Preserve knowledge assets: .wrapped/ (LGTM clusters, technique cards,
          # vault-export) and bundle-* (curated knowledge bundles). Only the
          # derived JSONL wrappers + normalized + enriched intermediates are
          # purged — the raw evidence remains as authoritative source.

          # Remove any empty directories under data/incoming (but keep the root
          # and everything under .wrapped/ or bundle-* which stays populated).
          find data/incoming -mindepth 1 -type d -empty \
            ! -path '*/.wrapped*' ! -path '*/bundle-*' \
            -delete 2>/dev/null || true

          echo "purge complete"

      - name: Commit generated knowledge
        id: commit
        if: steps.discover.outputs.count != '0' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hugin-bot"
          git config user.email "[private-email]"
          git add -A data/incoming data/normalized data/enriched data/source/public-graph.json data/source/ingest-manifest.json

          if git diff --staged --quiet; then
            echo "No generated changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "ingest: compile + purge sources"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Unable to push generated knowledge after retries" >&2
          exit 1

      # GITHUB_TOKEN pushes don't chain-trigger workflows. Dispatch pages
      # explicitly so the deploy runs with the freshly compiled graph.
      - name: Dispatch Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh workflow run pages.yml --ref main
          echo "Dispatched pages.yml"

      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "## HUGIN universal ingest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Inputs: ${{ steps.discover.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for report in data/enriched/*.report.json; do
            [[ -f "$report" ]] || continue
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugin-ingest-${{ github.run_id }}
          path: |
            data/incoming/*.mapping.json
            data/normalized/*.report.json
            data/enriched/*.report.json
          retention-days: 14
