# .github/workflows/ingest.yml
#
# Smart ingester for arbitrary JSONL files. Drop a JSONL into data/incoming/
# and the workflow will:
#   1. Ask Qwen3-4B what shape it has and how to map it (via detect-format.mjs)
#   2. Apply the mapping to produce data/normalized/<name>.jsonl
#   3. Feed that into the existing qa:ingest pipeline
#   4. Commit both the mapping.json (audit) and the normalized output back to main
#
# The LLM never writes code — it produces a JSON mapping-spec that a Node
# script walks with a minimal JSONPath evaluator. Fully replayable and
# auditable: re-running the workflow with the mapping.json present skips
# the LLM step.

name: Ingest incoming JSONL

on:
  push:
    branches: [main]
    paths:
      - "data/incoming/**.jsonl"
      - "scripts/detect-format.mjs"
      - "scripts/apply-mapping.mjs"
  workflow_dispatch:
    inputs:
      target:
        description: "Path to a specific JSONL under data/incoming/ (blank = all new files)"
        type: string
        default: ""
      force_redetect:
        description: "Force LLM re-detection even if mapping.json exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.actor != 'hugin-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # need history for rebase-before-push

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v5
        with:
          path: .hf-cache
          key: hf-gemma-4-e2b-it-v1
          restore-keys: |
            hf-gemma-4-e2b-it-

      - run: npm ci

      - name: Discover incoming JSONL files
        id: discover
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            echo "files=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            FILES=$(find data/incoming -maxdepth 1 -type f -name '*.jsonl' 2>/dev/null | sort | tr '\n' ' ')
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect + apply mapping per file
        env:
          HUGIN_MODEL_CACHE: .hf-cache
          FORCE: ${{ inputs.force_redetect && '--force' || '' }}
        run: |
          set -e
          FILES="${{ steps.discover.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No JSONL files found in data/incoming/"
            exit 0
          fi
          for f in $FILES; do
            echo "════════════════════════════════════════════════════════════════"
            echo "  $f"
            echo "════════════════════════════════════════════════════════════════"
            node scripts/detect-format.mjs "$f" $FORCE
            node scripts/apply-mapping.mjs "$f"
            NAME=$(basename "$f" .jsonl)
            NORM="data/normalized/${NAME}.jsonl"
            if [ -f "$NORM" ]; then
              node scripts/ingest.mjs "$NORM" --no-model
            fi
          done
          node scripts/build-data.mjs

      - name: Commit mapping + normalized artifacts
        run: |
          git config user.name  "hugin-bot"
          git config user.email "[private-email]"
          git add data/incoming/*.mapping.json 2>/dev/null || true
          git add data/normalized/ 2>/dev/null || true
          git add data/incoming/quarantine/ 2>/dev/null || true
          git add data/source/public-graph.json 2>/dev/null || true
          git add src/generated/ 2>/dev/null || true
          git add public/data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ingest artifacts to commit."
          else
            git commit -m "ingest: normalized artifacts"
            for i in 1 2 3; do
              if git push; then break; fi
              git fetch origin main && git rebase -X ours origin/main
              sleep 5
            done
          fi

      - name: Ingest summary
        if: always()
        run: |
          echo "## Ingest summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Records | Confidence | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for m in data/incoming/*.mapping.json; do
            [ -f "$m" ] || continue
            NAME=$(basename "$m" .mapping.json)
            CONF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$m')).confidence)")
            NORM="data/normalized/${NAME}.jsonl"
            if [ -f "$NORM" ]; then
              COUNT=$(wc -l < "$NORM")
              STATUS="normalized"
            elif [ -f "data/incoming/quarantine/${NAME}.jsonl" ]; then
              COUNT=0
              STATUS="quarantined"
            else
              COUNT=?
              STATUS="unknown"
            fi
            echo "| $NAME | $COUNT | $CONF/5 | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-run-${{ github.run_id }}
          path: |
            data/incoming/*.mapping.json
            data/normalized/**
            data/incoming/quarantine/**
          retention-days: 30
