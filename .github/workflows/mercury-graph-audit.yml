name: Mercury graph audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode: stratified sample now, full resume later"
        required: true
        default: "stratified"
        type: choice
        options: [stratified, full]
      sample_percent:
        description: "Percent of currently unprocessed nodes to sample by type"
        required: true
        default: "25"
        type: string
      sample_size:
        description: "Exact stratified sample size; 0 uses sample_percent"
        required: true
        default: "0"
        type: string
      min_per_type:
        description: "Minimum representation per type when capacity allows"
        required: true
        default: "3"
        type: string
      seed:
        description: "Deterministic sampling seed"
        required: true
        default: "hugin-mercury-v1"
        type: string
      concurrency:
        description: "Parallel Mercury requests"
        required: true
        default: "6"
        type: string
      reasoning_effort:
        description: "Mercury reasoning effort"
        required: true
        default: "instant"
        type: choice
        options: [instant, low, medium]
      persist_state:
        description: "Commit cumulative processed state to mercury-audit-state"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mercury-graph-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout graph source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout persistent Mercury state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: mercury-audit-state
          path: .mercury-state
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore seeded Mercury state
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .mercury-state/state/audit.jsonl ]]; then
            seed_file="$(find .mercury-state/state -maxdepth 1 -type f -name 'seed-audit-*.jsonl.gz.b64' | sort | tail -n 1)"
            if [[ -n "$seed_file" ]]; then
              base64 --decode "$seed_file" | gzip -dc > .mercury-state/state/audit.jsonl
              echo "Restored initial audit state from $seed_file"
            fi
          fi

      - name: Test deterministic helpers
        run: npm run test:mercury

      - name: Audit graph
        shell: bash
        env:
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          MERCURY_MODEL: mercury-2
          MERCURY_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_SAMPLE_PERCENT: ${{ inputs.sample_percent }}
          AUDIT_SAMPLE_SIZE: ${{ inputs.sample_size }}
          AUDIT_MIN_PER_TYPE: ${{ inputs.min_per_type }}
          AUDIT_SEED: ${{ inputs.seed }}
          AUDIT_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          test -n "${INCEPTION_API_KEY:-}" || { echo "Repository secret INCEPTION_API_KEY is required" >&2; exit 2; }
          [[ "$AUDIT_SAMPLE_PERCENT" =~ ^[0-9]+$ ]] || { echo "sample_percent must be an integer" >&2; exit 2; }
          (( AUDIT_SAMPLE_PERCENT >= 0 && AUDIT_SAMPLE_PERCENT <= 100 )) || { echo "sample_percent must be between 0 and 100" >&2; exit 2; }
          [[ "$AUDIT_SAMPLE_SIZE" =~ ^[0-9]+$ ]] || { echo "sample_size must be a non-negative integer" >&2; exit 2; }
          [[ "$AUDIT_MIN_PER_TYPE" =~ ^[0-9]+$ ]] || { echo "min_per_type must be a positive integer" >&2; exit 2; }
          (( AUDIT_MIN_PER_TYPE >= 1 )) || { echo "min_per_type must be at least 1" >&2; exit 2; }
          [[ "$AUDIT_CONCURRENCY" =~ ^[0-9]+$ ]] || { echo "concurrency must be a positive integer" >&2; exit 2; }
          (( AUDIT_CONCURRENCY >= 1 )) || { echo "concurrency must be at least 1" >&2; exit 2; }
          test -n "$AUDIT_SEED" || { echo "seed must not be empty" >&2; exit 2; }

          mkdir -p artifacts/mercury-audit
          args=(
            --graph data/source/public-graph.json
            --out-dir artifacts/mercury-audit
            --state-file .mercury-state/state/audit.jsonl
            --resume
            --concurrency "$AUDIT_CONCURRENCY"
            --seed "$AUDIT_SEED"
          )

          if [[ "$AUDIT_MODE" == "full" ]]; then
            args+=(--full)
          else
            args+=(
              --sample-percent "$AUDIT_SAMPLE_PERCENT"
              --sample-size "$AUDIT_SAMPLE_SIZE"
              --min-per-type "$AUDIT_MIN_PER_TYPE"
            )
          fi

          node scripts/mercury-audit-graph.mjs "${args[@]}"

      - name: Verify audit artifact
        if: success()
        shell: bash
        run: |
          test -s artifacts/mercury-audit/audit.jsonl
          test -s artifacts/mercury-audit/summary.json
          test -s artifacts/mercury-audit/sample-plan.json
          test -s artifacts/mercury-audit/processed-index.json
          test -s artifacts/mercury-audit/cleanup-plan.json
          test -s artifacts/mercury-audit/REPORT.md

      - name: Persist cumulative audit state
        if: ${{ success() && inputs.persist_state == true }}
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .mercury-state/state/runs
          cp artifacts/mercury-audit/audit.jsonl .mercury-state/state/audit.jsonl
          cp artifacts/mercury-audit/processed-index.json .mercury-state/state/processed-index.json
          cp artifacts/mercury-audit/summary.json .mercury-state/state/latest-summary.json
          cp artifacts/mercury-audit/sample-plan.json .mercury-state/state/latest-sample-plan.json
          cp artifacts/mercury-audit/cleanup-plan.json .mercury-state/state/latest-cleanup-plan.json
          cp artifacts/mercury-audit/summary.json ".mercury-state/state/runs/${RUN_ID}.json"
          rm -f .mercury-state/state/seed-audit-*.jsonl.gz.b64

          git -C .mercury-state config user.name "github-actions[bot]"
          git -C .mercury-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .mercury-state add state

          if git -C .mercury-state diff --cached --quiet; then
            echo "No persistent state changes"
          else
            git -C .mercury-state commit -m "audit(mercury): persist run ${RUN_ID}"
            git -C .mercury-state push origin HEAD:mercury-audit-state
          fi

      - name: Run summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/mercury-audit/REPORT.md ]]; then
            cat artifacts/mercury-audit/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hugin-mercury-audit-${{ github.run_id }}
          path: artifacts/mercury-audit/**
          if-no-files-found: warn
          retention-days: 30
