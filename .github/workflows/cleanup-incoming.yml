name: Cleanup ingested incoming files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually delete files (unchecked = dry-run report only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hugin-cleanup-incoming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'hugin-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (retry transient ONNX downloads)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            echo "npm ci failed; retrying transient dependency download ($attempt/3)"
            sleep $((attempt * 10))
          done

      - name: Run cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" == "true" ]]; then
            node scripts/cleanup-incoming.mjs --confirm | tee /tmp/hugin-cleanup-report.txt
          else
            node scripts/cleanup-incoming.mjs --dry-run | tee /tmp/hugin-cleanup-report.txt
          fi

      - name: Commit generated changes
        if: inputs.confirm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hugin-bot"
          git config user.email "[private-email]"
          git add data/incoming

          if git diff --staged --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "cleanup: purge ingested inputs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Unable to push cleanup after retries" >&2
          exit 1

      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "## HUGIN incoming cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ inputs.confirm == 'true' && 'confirm (deletions applied)' || 'dry-run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/hugin-cleanup-report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no report captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
